# Handrail Designer project file (slices 1 to 4: top rail bending and
# deflection, the rail to post weld, the intermediate rail and its weld to
# the post, post combined axial and flexure, post deflection, the post to
# baseplate weld, and the anchor reaction sets).
#
# Loading is per ASCE 7-22.
#
# Generate the calc:   uv run handrail calc examples/slice-1.toml
# The PDF is written beside this file (examples/slice-1.pdf).
#
# Dimensions accept 5' 6-1/8", 66.125 in, 3 ft 6 in, or a bare number,
# which is inches. Loads are in lb and lb/ft.

[project]
name = "Slice 1 example"
phase = "Development"
description = "Pipe top rail, interior span"
references = []           # e.g. ["Architectural drawings, sheet A-501"]
assumptions = []          # added to the tool's locked assumptions

[geometry]
span = "6'-0\""           # post to post, center to center
post_height = "3'-6\""    # h: top of concrete to top rail centerline
baseplate_thickness = "1/2"   # t_p

[top_rail]
section = "Pipe2STD"      # AISC designation (AISC Shapes Database v16.0)
grade = "A53 Gr B"        # A53 Gr B is the only grade supported so far

[post]
section = "Pipe2STD"      # AISC designation (AISC Shapes Database v16.0)
grade = "A53 Gr B"

[intermediate_rail]
# One of three states. Same as the top rail (the default): its section,
# grade and rail to post weld size. Its own section: set
# same_as_top_rail = false and give section (grade defaults to the top
# rail's), [welds] intermediate_rail_to_post and, optionally,
# [deflection.intermediate_rail]. None: set none = true.
same_as_top_rail = true
# section = "Pipe1-1/4STD"
# grade = "A53 Gr B"

[baseplate]
B = 6                     # plan dimension parallel to the rail
N = 8                     # plan dimension perpendicular to the rail
grade = "A36"             # A36 is the only baseplate grade supported (all of v1)

[welds]
# Fillet welds all around, leg size. Required: there is no default size.
rail_to_post = "1/8"
post_to_baseplate = "1/4"
electrode = "E70XX"       # E70XX is the only electrode supported

[loads]
# Leave these out to use the ASCE 7-22 values from the registry.
# concentrated_lb = 200
# uniform_plf = 50
# component_lb = 50       # intermediate rail. OSHA 1910.29(b)(5) requires
#                         # intermediate members to withstand 150 lb downward
#                         # or outward; enter 150 lb where OSHA applies.

[loads.uniform_exemption]
applies = false
statement = ""            # required when applies = true: why §4.5.1.1 exempts this guard

[deflection.rail]
limit_L_over = 120        # limit = L / 120 (engineering judgement, not code)
bypass = false

[deflection.post]
limit_L_over = 60         # limit = (h - t_p) / 60 (engineering judgement, not code)
bypass = false
