# Test case 1: Micah's hand calc.
#
# Pipe1-1/2STD top rail, 7'-0" span, A53 Gr B, default ASCE 7-22 loads,
# interior post. The span is chosen so the concentrated load should control
# bending and the distributed load should control deflection.
#
# Post inputs were added in slice 2, because every project now has a post
# (docs/plans/slice-2.md, D9): the same post as test case 2. This case
# records no post values; its hand values are for Checks 1 and 2 only.
#
# Inputs use the project file format. Hand values go under [hand]; replace
# each "pending" with the hand-calculated number, in the unit named by the
# key's suffix. Every value must be within 0.5% (relative) of the tool's.
# Give ratios to 3 significant figures (not rounded to 2 decimals).
#
# A pending value skips its test without showing the tool's value. A
# mismatch fails and, per CLAUDE.md rule 2, stops the work: neither side is
# changed until we know which one is wrong.

[project]
name = "Test case 1"
phase = "Verification"
description = "Pipe1-1/2STD top rail, 7'-0\" span, default loads"

[geometry]
span = "7'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "Pipe1-1/2STD"
grade = "A53 Gr B"

[post]
section = "Pipe1-1/2STD"
grade = "A53 Gr B"

[welds]                # slice 3 (plan T2): input only; no weld values recorded
rail_to_post = "1/8"
post_to_baseplate = "1/4"

[deflection.rail]
limit_L_over = 120
bypass = false

# Full-hand case (docs/brief/verification.md): every tool value in the
# covered groups has a [hand] value.
[verification]
kind = "full-hand"
covers = ["section", "check1", "check2"]

# ---------------------------------------------------------------------------
# Hand values
#
# Provenance: every value below comes from Micah's independent hand calc,
# done before he saw any tool output, with two exceptions recorded here:
#
# - check1.moment_lbin.upward_distributed: entered as 355.048, a
#   transcription typo; Micah confirmed 3,555.05 lb-in (his own ratio,
#   0.403, was already consistent with 3,555.05).
# - The four upward deflection values (check2.deflection_in and
#   check2.ratio, upward_concentrated and upward_distributed): the hand
#   calc credited 0.6D against the upward deflection. After comparison,
#   Micah kept plan D2 (upward deflection is live load only) and replaced
#   them with his live-only values, his Delta_L before the 0.6D credit.
#   These four were corrected to the rule after seeing the tool's values,
#   so they are not an independent check of the tool.
# ---------------------------------------------------------------------------

[hand.section]
