# Test case 1: Micah's hand calc.
#
# Pipe1-1/2STD top rail, 7'-0" span, A53 Gr B, default ASCE 7-22 loads,
# interior post. The span is chosen so the concentrated load should control
# bending and the distributed load should control deflection.
#
# Inputs use the project file format. Hand values go under [hand]; replace
# each "pending" with the hand-calculated number, in the unit named by the
# key's suffix. Every value must be within 0.5% (relative) of the tool's.
# Give ratios to 3 significant figures (not rounded to 2 decimals).
#
# A pending value skips its test without showing the tool's value. A
# mismatch fails and, per CLAUDE.md rule 2, stops the work: neither side is
# changed until we know which one is wrong.

[project]
name = "Test case 1"
phase = "Verification"
description = "Pipe1-1/2STD top rail, 7'-0\" span, default loads"

[geometry]
span = "7'-0\""

[top_rail]
section = "Pipe1-1/2STD"
grade = "A53 Gr B"

[deflection.rail]
limit_L_over = 120
bypass = false

# ---------------------------------------------------------------------------
# Hand values
# ---------------------------------------------------------------------------

[hand.section]
# Section properties used (AISC Shapes Database v16.0, as published)
D_in = "pending"
tdes_in = "pending"
I_in4 = "pending"
S_in3 = "pending"
Z_in3 = "pending"
D_t = "pending"
w_D_plf = "pending"            # rail dead load = tabulated W

[hand.check1]
Mn_lbin = "pending"
Mn_over_Omega_lbin = "pending"
controlling = "pending"        # e.g. "downward, concentrated"

[hand.check1.moment_lbin]      # required moment M_a for each envelope case
downward_concentrated = "pending"
downward_distributed = "pending"
outward_concentrated = "pending"
outward_distributed = "pending"
inward_concentrated = "pending"
inward_distributed = "pending"
upward_concentrated = "pending"
upward_distributed = "pending"

[hand.check1.ratio]
downward_concentrated = "pending"
downward_distributed = "pending"
outward_concentrated = "pending"
outward_distributed = "pending"
inward_concentrated = "pending"
inward_distributed = "pending"
upward_concentrated = "pending"
upward_distributed = "pending"

[hand.check2]
Delta_allow_in = "pending"
controlling = "pending"        # e.g. "downward, distributed"

[hand.check2.deflection_in]    # deflection for each envelope case
downward_concentrated = "pending"
downward_distributed = "pending"
outward_concentrated = "pending"
outward_distributed = "pending"
inward_concentrated = "pending"
inward_distributed = "pending"
upward_concentrated = "pending"
upward_distributed = "pending"

[hand.check2.ratio]
downward_concentrated = "pending"
downward_distributed = "pending"
outward_concentrated = "pending"
outward_distributed = "pending"
inward_concentrated = "pending"
inward_distributed = "pending"
upward_concentrated = "pending"
upward_distributed = "pending"
