# Test case 9 (docs/plans/slice-6.md, T3; S6-15): the mixed case. A square
# HSS post under a pipe rail, with a rectangular HSS intermediate rail and
# the post welded to the baseplate on one pair of faces.
#
# Top rail: Pipe2STD. Post: HSS2X2X1/8. Intermediate rail: its own section,
# HSS2X1X1/8, long side horizontal. Every grade is left out of this file on
# purpose, so the defaults apply (A53 Gr B for the pipe, A500 Gr B for the
# rectangular HSS; S5-5, S6-5). L = 6'-0", h = 42 in, t_p = 1/2 in;
# baseplate B = 6 in (parallel to the rail) x N = 8 in (perpendicular to
# the rail), A36. Fillet welds, E70XX: rail to post 1/8 in, intermediate
# rail to post 1/8 in, post to baseplate 3/16 in on the faces parallel to
# the rail. Default loads (P = 200 lb, w = 50 plf, 50 lb component load),
# no exemption; default deflection limits.
#
# The inputs are Claude's proposal (plan, open item 7): S6-15 fixes what
# the case is, not its sections, weld sizes or pattern. Micah confirms or
# changes them before the independent calc runs. One consequence to
# confirm with them: the plan's planning arithmetic has this face-pair
# weld over 1.00 in Check 7, in the direction that bends the two weld
# lines about their own length, so the case as proposed prints Check 7 NG.
#
# Branches it reaches: a rectangular post on a round rail, the weld on the
# post's own rounded rectangle (S6-9); a rectangular post in Checks 5 and
# 6 (S6-14 item 2); a rectangular intermediate rail in Check 4a (S6-16
# item 3) and on a rectangular post in Check 4b (Table K5.1, S6-8); the
# face-pair base weld with the post wall checked on its own lines (S6-6,
# S6-7).
#
# What it covers ([verification] covers): the post group, the intermediate
# rail, Checks 3, 4a, 4b, 5, 6 and 7, and the reaction sets. The top
# rail's section group and Checks 1 and 2 are not covered: they are a
# Pipe2STD rail, verified in earlier cases.
#
# Values: an independent-calc case (docs/brief/verification.md). The
# independent calc records every value the test compares in
# tests/cases/independent/case-09.toml, written up beside it as case-09.md,
# in a fresh session by the independent-calc skill (CLAUDE.md rule 6). Every
# value there is "pending" until that session fills it.
#
# [hand] below holds Micah's governing-case values for what is new to his
# arithmetic ([verification] recompute; S6-15): Checks 5 and 7. He follows
# the tool's printed controlling case and recomputes it line by line; each
# value is his own result, never copied from the PDF (CLAUDE.md rule 5).
#
# Each [hand] value is "deferred" to the release review (ADR 0006; issue
# #18). At that review, replace each "deferred" with the recomputed value,
# in the unit named by the key's suffix, to 4 significant figures.
#
# Text values, in quotes:
#   checkN.controlling     direction, comma, load type, e.g. "outward, distributed"
#
# Each ratio key names the case the plan's planning arithmetic worked
# (docs/plans/slice-6.md, T3), not a tool result. If your recompute finds
# another case governs, rename the key to that case.
#
# The A500 Gr B rectangular Fy and Fu this case turns on are drafted
# registry entries, which Micah verifies at the release review.
#
# A mismatch fails and, per CLAUDE.md rule 2, stops the work: neither side
# is changed until we know which one is wrong.

[project]
name = "Test case 9"
phase = "Verification"
description = "Mixed: HSS2X2X1/8 post under a Pipe2STD rail, HSS2X1X1/8 intermediate rail, face-pair base weld"

[geometry]
span = "6'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "Pipe2STD"         # grade left out: the pipe default applies (S5-5)

[post]
section = "HSS2X2X1/8"       # grade left out: the rectangular HSS default applies (S6-5)

[intermediate_rail]
same_as_top_rail = false
section = "HSS2X1X1/8"
long_side = "horizontal"

[baseplate]
B = 6                        # parallel to the rail
N = 8                        # perpendicular to the rail
grade = "A36"

[welds]
rail_to_post = "1/8"
intermediate_rail_to_post = "1/8"
post_to_baseplate = "3/16"
base_pattern = "faces parallel to rail"
electrode = "E70XX"

[deflection.rail]
limit_L_over = 120
bypass = false

[deflection.post]
limit_L_over = 60
bypass = false

[deflection.intermediate_rail]
limit_L_over = 120
bypass = false

[verification]
kind = "independent-calc"
covers = ["post", "check3", "intermediate", "check4a", "check4b", "check5", "check6", "check7", "reactions"]
recompute = ["check5", "check7"]

# ---------------------------------------------------------------------------
# Hand values: Micah's recompute of the governing case of Checks 5 and 7
# (deferred to the release review)
# ---------------------------------------------------------------------------

[hand.check5]
controlling = "deferred"      # e.g. "outward, distributed"

[hand.check5.ratio]
outward_distributed = "deferred"

[hand.check7]
controlling = "deferred"      # e.g. "longitudinal, distributed"

[hand.check7.ratio]
longitudinal_distributed = "deferred"
