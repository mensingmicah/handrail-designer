# Extra golden scenario full-rect-on-edge (tests/test_golden.py, the second tier).
# The tool runs this project and its whole printed calc is compared with full-rect-on-edge.typ.
# Slice 6: a rail on edge (noncompact flange, LTB with Cb), a post with its long side perpendicular to the rail (LTB with Cb = 1.0, the longitudinal case on its weak axis), a face-pair base weld, and an intermediate rail narrower than the post face (plan, open item 1).
# Inputs only: this file holds no value, and none is ever copied into a test case.

[project]
name = "char"

[geometry]
span = "6'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "HSS4X2X1/8"
long_side = "vertical"

[post]
section = "HSS2X1X3/16"
long_side = "perpendicular to rail"

[welds]
rail_to_post = "1/8"
post_to_baseplate = "3/16"
intermediate_rail_to_post = "1/8"
base_pattern = "faces perpendicular to rail"

[baseplate]
B = 6
N = 8

[intermediate_rail]
same_as_top_rail = false
section = "HSS2X1X1/8"
long_side = "vertical"
