# Extra golden scenario full-mixed-round-inter (tests/test_golden.py, the second tier).
# The tool runs this project and its whole printed calc is compared with full-mixed-round-inter.typ.
# Slice 6: a pipe intermediate rail on a square post under a pipe rail; the base weld on the faces perpendicular to the rail.
# Inputs only: this file holds no value, and none is ever copied into a test case.

[project]
name = "char"

[geometry]
span = "6'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "Pipe2STD"

[post]
section = "HSS2X2X1/8"

[welds]
rail_to_post = "1/8"
post_to_baseplate = "3/16"
intermediate_rail_to_post = "1/8"
base_pattern = "faces perpendicular to rail"

[baseplate]
B = 6
N = 8

[intermediate_rail]
same_as_top_rail = false
section = "Pipe1-1/4STD"
