# Extra golden scenario full-rect-square (tests/test_golden.py, the second tier).
# The tool runs this project and its whole printed calc is compared with full-rect-square.typ.
# Slice 6: square HSS throughout, welded all around; Table K5.1 with the effective width uncapped.
# Inputs only: this file holds no value, and none is ever copied into a test case.

[project]
name = "char"

[geometry]
span = "6'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "HSS3X3X1/8"

[post]
section = "HSS2X2X3/16"

[welds]
rail_to_post = "1/8"
post_to_baseplate = "3/16"
intermediate_rail_to_post = "1/8"
base_pattern = "all around"

[baseplate]
B = 6
N = 8

[intermediate_rail]
same_as_top_rail = false
section = "HSS2X2X1/8"
