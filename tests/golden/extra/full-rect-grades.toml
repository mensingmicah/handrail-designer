# Extra golden scenario full-rect-grades (tests/test_golden.py, the second tier).
# The tool runs this project and its whole printed calc is compared with full-rect-grades.typ.
# Slice 6: rectangular HSS grades (S6-5): an A500 Gr C rail (the Chapter K ductility exception, S6-13), an A618 Gr II post and an A501 Gr B intermediate rail.
# Inputs only: this file holds no value, and none is ever copied into a test case.

[project]
name = "char"

[geometry]
span = "6'-0\""
post_height = 42
baseplate_thickness = "1/2"

[top_rail]
section = "HSS3X3X3/16"
grade = "A500 Gr C"

[post]
section = "HSS2X2X1/4"
grade = "A618 Gr II"

[welds]
rail_to_post = "1/8"
post_to_baseplate = "3/16"
intermediate_rail_to_post = "1/8"
base_pattern = "all around"

[baseplate]
B = 6
N = 8

[intermediate_rail]
same_as_top_rail = false
section = "HSS2X2X1/8"
grade = "A501 Gr B"
