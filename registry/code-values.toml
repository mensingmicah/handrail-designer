[[entry]]
id = "material.steel.density"
value = 490
unit = "lb/ft^3"
cite = "AISC Manual 16th Ed., Part 17"
document = "AISC Steel Construction Manual"
edition = "16th Edition"
section = "Part 17, table of weights and specific gravities (table number not recalled)"
source = "memory"
status = "drafted"
drafted_on = 2026-09-30
verified_by = ""
verified_date = ""
note = """
Value 490 supplied by Micah in the design interview; the citation is \
drafted. I found no AISC text stating it: web searches only returned \
secondary pages repeating 490 lb/ft^3, and I could not recall or find the \
Part 17 table number (I believe Part 1 also states this density as the basis \
for tabulated shape weights). Check by computation, not a citation: in the \
AISC Shapes Database v16.0, W/A for W, S, HP, C, MC, L and WT shapes is \
3.35 to 3.45 lb/ft per in^2, which is 483 to 497 lb/ft^3 (490 lb/ft^3 = \
3.403 lb/ft per in^2), so 490 is consistent. Confirm which manual location \
to cite. Separate warning: tabulated W for HSS and PIPE is about 3.57 to \
3.78 times A (515 to 545 lb/ft^3 equivalent), because W is computed from \
nominal wall and A from design wall. Density times A is therefore not the \
tabulated weight for those shapes; see the brief's dead-load bullet for \
custom sections."""

