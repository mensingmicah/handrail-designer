# Code-value registry. See CLAUDE.md rule 1.
#
# Every code value and every piece of code provision text the tool uses lives
# here. Claude may draft entries; only Micah fills verified_by and
# verified_date, and sets status = "verified" when he does.
#
# status:  "drafted"  written by Claude, not yet checked against the standard
#          "verified" checked by Micah against the standard
# source:  "memory", the URL the entry was drafted from, or "engineer" for a
#          value Micah supplied directly. An "engineer" entry stays "drafted"
#          until he verifies it.
#
# Any calc that uses a drafted entry prints "DRAFT: contains unverified code
# values" on every page and lists those entries.
#
# Fields: id, value, unit, cite, document, edition, section, source, status,
# drafted_on, verified_by, verified_date, and an optional note.
# cite:    the short citation the calc prints beside each line that uses the
#          entry; section holds the full location.
# unit:    a pint unit string (forces are "lbf", since pint's "lb" is mass),
#          "" for a dimensionless number, or one of "text", "list",
#          "equation", "provision", "factors".
# An "equation" or "provision" entry cites a formula or rule that is
# implemented once in the code (ADR 0002); its value describes what is cited
# and deliberately does not restate the formula, so the two cannot drift.
# Numeric coefficients inside equations are separate entries.
#
# The tool refuses to load this file if the review list below is not exactly
# the set of drafted entries.

# ---------------------------------------------------------------------------
# REVIEW LIST: every entry with status = "drafted". Review top to bottom.
# Remove an id from this list when you mark its entry verified.
# ---------------------------------------------------------------------------
review = [
  "material.steel.density",
  "material.steel.E",
  "material.grades.pipe",
  "material.grades.hss_round",
  "material.grades.hss_rect",
  "asce7.guard.uniform.exemption.intro",
  "asce7.guard.uniform.exemption.1",
  "asce7.guard.uniform.exemption.2",
  "asce7.guard.uniform.exemption.3",
  "asce7.guard.concentrated",
  "asce7.guard.uniform",
  "asce7.combo.asd.D_plus_L",
  "material.A53_GrB.Fy",
  "aisc360.pipe_as_round_hss",
  "aisc360.F1.omega_b",
  "aisc360.B4.1b.round_hss.lambda_p",
  "aisc360.B4.1b.round_hss.lambda_r",
  "aisc360.B4.1b.classification",
  "aisc360.F8.applicability",
  "aisc360.F8.nominal_strength",
  "aisc360.eq.F8-1",
  "aisc360.eq.F8-2",
  "aisc360.eq.F8-2.coeff",
  "aisc_manual.t3-23.case1.M",
  "aisc_manual.t3-23.case1.delta",
  "aisc_manual.t3-23.case7.M",
  "aisc_manual.t3-23.case7.delta",
  "aisc360.eq.B3-2",
  "ej.bending.srss_round",
  "ej.combo.bending.upward",
  "ej.combo.deflection.D_plus_L",
  "ej.combo.deflection.L_only",
  "ej.deflection.limit",
]

