# --- Chapter K: the chord D/t limit (S5-3) ----------------------------------

[[entry]]
id = "aisc360.K.round_chord.D_over_t_max"
value = 50
unit = ""
cite = "AISC 360-22 Tables K3.1A and K4.1A"
document = "AISC 360-22, Specification for Structural Steel Buildings"
edition = "2022"
section = "Chapter K, Table K3.1A, Limits of Applicability of Table K3.1 (round HSS-to-HSS truss connections), page 16.1-164, and Table K4.1A, Limits of Applicability of Table K4.1 (round HSS-to-HSS moment connections), page 16.1-168: chord wall slenderness D/t for T- and Y-connections"
source = "AISC 360-22 text, read 2026-10-10"
status = "drafted"
drafted_on = 2026-10-10
verified_by = ""
verified_date = ""
note = """
The value and both table numbers were read in the 360-22 text \
(re-cited 2026-10-10; first drafted the same day from the 2016 \
edition, which has the same numbers). The chord wall limit is D/t of \
50 for T-, Y- and K-connections in the truss table (K3.1A, page \
16.1-164) and for T- and Y-connections in the moment table (K4.1A, \
page 16.1-168), and 40 for cross-connections in both. The same tables \
carry other limits the tool does not test, because W7 leaves the \
Chapter K limit states unchecked: branch wall slenderness (Db/tb of 50 \
or less, and 0.05E/Fyb or less), the width ratio (over 0.2, up to \
1.0), Fy and Fyb of 52 ksi or less, and Fy/Fu and Fyb/Fub of 0.8 or \
less (ASTM A500 Grade C is noted as acceptable). Slice 6 checks the \
chord limit states and decides what becomes of this stop (S5-3)."""

