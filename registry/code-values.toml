value = "Post wall at the weld: covered by Check 5. The wall carries the weld force as stress along the post axis, the same demand as Check 5 at its critical section; member shear is not checked (stated assumption)."
unit = "text"
cite = "Engineering judgement (EOR): post wall at the weld covered by Check 5"
document = "Engineering decision of the engineer of record"
edition = "docs/brief/welds.md, W5"
section = "Base metal follows the direction of the force: the post side of both welds"
source = "engineer"
status = "drafted"
drafted_on = 2026-10-08
verified_by = ""
verified_date = ""
note = """
Micah, 2026-10-04 (W5). Printed in Checks 3 and 7. The top of the post \
sees the same V and less moment than the base, so Check 5 at the base \
covers the post side of Check 3 too. Holds only while Fu/Fy >= 1.20 for \
the post grade (ej.weld.post_wall.fu_fy_min, checked at validation)."""

