# --- AISC 360-22 B4.2: design wall thickness for HSS (S5-6, S5-8) -----------
# Drafted from the 360-22 text, as S5-6 asked (re-cited 2026-10-10 from
# the engineer's copy of the Specification, page 16.1-24). The rule is
# keyed on the ASTM standard, not on ERW against SAW.

[[entry]]
id = "aisc360.B4.2.design_wall"
value = "Calculations involving the wall thickness of an HSS use the design wall thickness: the nominal wall for HSS produced to ASTM A1065 or ASTM A1085, and a fraction of the nominal wall for HSS produced to the other approved standards."
unit = "provision"
cite = "AISC 360-22 §B4.2"
document = "AISC 360-22, Specification for Structural Steel Buildings"
edition = "2022"
section = "§B4.2, Design Wall Thickness for HSS, page 16.1-24"
source = "AISC 360-22 text, read 2026-10-10"
status = "drafted"
drafted_on = 2026-10-10
verified_by = ""
verified_date = ""
note = """
Paraphrase of the 360-22 text, §B4.2 on page 16.1-24, as S5-6 asked \
(re-cited 2026-10-10; first drafted the same day from the 2016 \
edition's text, which reads the same on these points). The rule is by \
ASTM standard: the nominal thickness for box sections and for HSS \
produced to ASTM A1065/A1065M or ASTM A1085/A1085M, and 0.93 times the \
nominal wall thickness for HSS produced to other standards approved for \
use under the Specification. It does not key on \
electric-resistance-welded against submerged-arc-welded, so seamless \
and hot-formed tubing to A501 or A618 takes 0.93 like A500, and S5-6's \
stop-and-ask condition is not met. The same section carries a User Note \
allowing pipe to ASTM A53/A53M Grade B to be designed as round HSS (see \
aisc360.pipe_as_round_hss). The tool applies this rule to a custom tube \
only; a database section uses its published t_des (S5-6)."""

[[entry]]
id = "aisc360.B4.2.coeff"
value = 0.93
unit = ""
cite = "AISC 360-22 §B4.2"
document = "AISC 360-22, Specification for Structural Steel Buildings"
edition = "2022"
section = "§B4.2, Design Wall Thickness for HSS, page 16.1-24: the coefficient on the nominal wall thickness for HSS produced to standards other than ASTM A1065/A1065M and A1085/A1085M"
