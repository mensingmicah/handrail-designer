[[entry]]
id = "ej.weld.directional_round_hss"
value = "The directional strength increase of AISC 360-22 §J2.4(a) is applied at the post to baseplate weld at the engineer's election. The Specification gives no procedure for strain compatibility in a round weld under out-of-plane bending; the election rests on the Steel Tube Institute's testing of fillet welds to round HSS and on the elastic method being a first-failure check."
unit = "text"
cite = "Engineering judgement (EOR), after STI: directional increase on round HSS"
document = "Steel Tube Institute, Directionality Increase for Fillet Welds to HSS (after Packer et al. testing)"
edition = "docs/brief/welds.md, W2 as revised 2026-10-10"
section = "Directional strength increase: an engineer's election at the post to baseplate weld, off by default; its basis on round HSS"
source = "engineer"
status = "drafted"
drafted_on = 2026-10-08
verified_by = ""
verified_date = ""
note = """
Micah, 2026-10-04 (W2), revised by his ruling of 2026-10-10: the \
increase is no longer automatic at the post to baseplate weld. It is an \
input, [welds] directional_increase, false unless the engineer sets it. \
Not elected, k_ds is aisc360.J2.4.kds_other. Elected, k_ds is Eq. J2-5 \
as before, and the value of this entry prints beside it as the line \
saying the increase is applied at the engineer's election; the wording \
is Claude's proposal for Micah to accept or reword in the slice 5 pull \
request. The value changed on 2026-10-10 from a statement that the \
increase applies to round HSS; the cite is unchanged. \
His reasoning: 360-22 handles strain compatibility explicitly only for \
weld groups analyzed by the instantaneous center method and for \
concentric groups of longitudinal and transverse welds (Eq. J2-6); a \
round base weld under out-of-plane bending has no code procedure, and \
taking the increase rests on HSS research and on the elastic method \
being a first-failure check. That is engineering judgement, so the \
engineer elects it. \
A non-primary source; I did not open the STI piece and have no URL for \
it. Applying the increase under base moment extends that test basis, \
which was axial tension. Read in the 360-22 text on 2026-10-10 \
(Commentary on §J2.4, page 16.1-490, paraphrased): the tests were of \
fillet welds joining the end of an HSS in axial tension to a rigid \
plate; numerical work by Tousignant and Packer (2017a) gave round HSS a \
reliability index of 3.6 against the target of 4.0, and on that basis \
fillet welds to the ends of tension-loaded round HSS were left out of \
the prohibition that sets the factor to 1.0 for rectangular HSS. \
Slice 5 (S5-12; Claude's, confirmed by Micah 2026-10-09): the election \
is open for every round hollow post, whatever its grade, custom round \
tubes included. The test basis is cold-formed round HSS; a hot-formed \
grade (A501, A618) extends it by the same engineering judgement this \
entry already records for base moment. Which posts the weld code allows \
is the Check 7 joint's table (docs/brief/stops.md)."""

