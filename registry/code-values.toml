# Slice 5, Micah's rulings of 2026-10-10 on the welds. docs/brief/welds.md:
# W2 as revised (the directional strength increase is the engineer's
# election at the post to baseplate weld, off by default).
# ---------------------------------------------------------------------------

[[entry]]
id = "aisc360.J2.4.kds_other"
value = 1.0
unit = ""
cite = "AISC 360-22 §J2.4(a)(3)"
document = "AISC 360-22, Specification for Structural Steel Buildings"
edition = "2022"
section = "§J2.4(a), Strength, fillet welds, directional strength increase factor k_ds: condition (3), all other conditions, page 16.1-130"
source = "AISC 360-22 text, read 2026-10-10"
status = "drafted"
drafted_on = 2026-10-10
verified_by = ""
verified_date = ""
note = """
Read in the 360-22 text, §J2.4(a) on page 16.1-130. The fillet weld \
strength is Eq. J2-4, with k_ds by three conditions: (1) Eq. J2-5 for \
fillet welds where strain compatibility of the various weld elements is \
considered; (2) 1.0 for fillet welds to the ends of rectangular HSS \
loaded in tension; (3) 1.0 for all other conditions. This entry is \
condition (3). The calc prints it at the post to baseplate weld (Check \
7) when the engineer has not elected the directional increase, which is \
the default (Micah, 2026-10-10; docs/brief/welds.md, W2 as revised; \
ej.weld.directional_round_hss). Two User Notes on the same page say \
where strain compatibility is satisfied or considered: the \
instantaneous center method, for weld groups of elements in various \
directions; and a linear weld group of uniform leg size, connecting \
elements of uniform stiffness, loaded through its center of gravity. A \
ring is not a linear group. §J2.4(b) on page 16.1-132 gives Eq. J2-6 \
for concentrically loaded groups of longitudinal and transverse \
elements."""

# --- Thin material at a weld (Micah's ruling of 2026-10-10) -----------------
# docs/brief/welds.md, "Thin material at a weld". Raised by case 6's
# independent calc: a 1/8 in fillet on a 0.055 in wall.

[[entry]]
id = "aws.d1_1.thickness_min"
value = 0.125
unit = "inch"
cite = "AWS D1.1/D1.1M:2020, Clause 1"
document = "AWS D1.1/D1.1M, Structural Welding Code - Steel"
edition = "2020"
section = "Clause 1, General Requirements: the limits of the code's application, steel 1/8 in [3 mm] or thicker. The subclause number in the 2020 edition is not confirmed"
source = "memory"
status = "drafted"
drafted_on = 2026-10-10
verified_by = ""
verified_date = ""
note = """
From memory; I do not have AWS D1.1 and did not open it. I am confident \
of the 1/8 in [3 mm] lower limit and not of where the 2020 edition \
states it: earlier editions gave it under a Limitations subclause of \
Clause 1 (1.2 as I recall it), and the 2020 edition renumbered Clause 1. \
The edition is the one AISC 360-22 references (§A2, page 16.1-6, read \
2026-10-10, which lists AWS D1.1/D1.1M:2020 and AWS D1.3/D1.3M:2018). \
360-22 §J2 (page 16.1-124) requires welding to conform to AWS D1.1 \
except where the Specification differs. The tool compares each part a \
fillet weld joins with this value, walls at their nominal thickness and \
the baseplate as entered, and prints a warning for a part under it \
(Micah, 2026-10-10; ej.weld.thin_material). A part at exactly 1/8 in \
is inside the range. A warning, not a stop."""

[[entry]]
id = "aws.d1_1.scope"
value = "AWS D1.1, Structural Welding Code - Steel, applies to carbon and low-alloy steel 1/8 in (3 mm) or thicker"
unit = "provision"
cite = "AWS D1.1/D1.1M:2020, Clause 1"
document = "AWS D1.1/D1.1M, Structural Welding Code - Steel"
edition = "2020"
section = "Clause 1, General Requirements: scope and limitations of the code (base metal thickness and specified minimum yield strength). The subclause number in the 2020 edition is not confirmed"
source = "memory"
status = "drafted"
drafted_on = 2026-10-10
verified_by = ""
verified_date = ""
note = """
A paraphrase from memory, not the code's wording; I do not have AWS \
D1.1 and I am not sure how the 2020 edition words it or which subclause \
holds it. As I recall it, the code says it was developed for welded \
structures of carbon and low-alloy steel 1/8 in [3 mm] or thicker with \
a specified minimum yield strength of 100 ksi [690 MPa] or less, and \
earlier editions pointed to AWS D1.3, Structural Welding Code - Sheet \
Steel, for thinner base metal. I am not sure the 2020 edition still \
makes that reference, so the value printed here does not claim it; the \
D1.3 example is in the warning's own words (ej.weld.thin_material), \
which are the engineer's. I recall AWS D1.3 as covering sheet steel up \
to 3/16 in, unverified. The yield strength limit is not printed: every \
grade the tool offers is far below it. Printed only inside the \
thin-material warning. Confirm the wording and the clause."""

